
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registration and Accommodation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>

<body class="form-page">

<header>
     <img src="7000.webp"style="width: 60px;height: 60px">
    <h1>SOME PHOTOS OF DIFFERENT PLACES</h1>

  <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="product.html">Product</a>
            <a href="activities.html">Activities</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
</header>

<main class="container mt-4">

    <div class="row g-4">

        
        <div class="col-md-6">

            <form id="accommodationForm"
                  class="accommodation-form"
                  onsubmit="submitAccommodation(event)">

                <h3>ACCOMMODATION FORM</h3>

                <label for="accommodationName">Names:</label>
                <input type="text" id="accommodationName"
                       class="form-control mb-3" required>

                <label for="accommodationEmail">Email:</label>
                <input type="email" id="accommodationEmail"
                       class="form-control mb-3" required>

                <label for="accommodationPhone">Telephone:</label>
                <input type="tel" id="accommodationPhone"
                       class="form-control mb-3" required>

                <label for="accommodationType">Type of accommodation:</label>
                <select id="accommodationType"
                        class="form-select mb-3" required>

                    <option value="">Choose accommodation</option>
                    <option value="Hotel">Hotel</option>
                    <option value="Lodge">Lodge</option>
                    <option value="Guest House">Guest House</option>
                    <option value="Camping">Camping</option>

                </select>

                <label>Gender:</label><br>

                <input type="radio" name="accommodationGender"
                       value="Male" required>
                <label>Male</label>

                <input type="radio" name="accommodationGender"
                       value="Female">
                <label>Female</label>

                <br><br>

                <button type="submit" class="btn btn-info">
                    Submit
                </button>

                <button type="reset" class="btn btn-danger">
                    Reset
                </button>

                <p id="accommodationResult" class="mt-3"></p>

            </form>

        </div>

        
        <div class="col-md-6">

            <form id="myForm"
                  class="registration-form"
                  onsubmit="registerUser(event)">

                <h2>REGISTRATION FORM</h2>

                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName"
                       class="form-control mb-3" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email"
                       class="form-control mb-3" required>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone"
                       class="form-control mb-3" required>

                <label>Gender:</label><br>

                <input type="radio" name="gender"
                       value="Male" required>
                <label>Male</label>

                <input type="radio" name="gender"
                       value="Female">
                <label>Female</label>

                <hr>

                <h4>Login Form</h4>

                <label for="password">Password:</label>
                <input type="password" id="password"
                       class="form-control mb-3"
                       placeholder="Enter password"
                       minlength="6" required>

                <input type="checkbox" id="showPassword"
                       onchange="showMyPassword()">

                <label for="showPassword">Show Password</label>

                <br><br>

                <button type="submit" class="btn btn-success">
                    Register
                </button>

                <button type="reset" class="btn btn-danger">
                    Reset
                </button>

                <p id="result" class="mt-3"></p>

            </form>

        </div>

    </div>

</main>

<footer class="footer">
    <p>&copy; 2026 Discover Lesotho Tourism. All rights reserved.</p>
</footer>

<script>
function submitAccommodation(event) {

    event.preventDefault();

    let name = document.getElementById("accommodationName").value;

    let type = document.getElementById("accommodationType").value;

    document.getElementById("accommodationResult").innerHTML =
        "Accommodation form submitted successfully! Thank you " +
        name + ". Your selected accommodation is " + type + ".";

}



function registerUser(event) {

    event.preventDefault();

    let name = document.getElementById("fullName").value;

    document.getElementById("result").innerHTML =
        "Registration Successful! Welcome " + name;

}



function showMyPassword() {

    let password = document.getElementById("password");

    let showPassword = document.getElementById("showPassword");

    if (showPassword.checked) {

        password.type = "text";

    } else {

        password.type = "password";

    }

}



document.getElementById("accommodationForm").onreset = function() {

    document.getElementById("accommodationResult").innerHTML = "";

};



document.getElementById("myForm").onreset = function() {

    document.getElementById("result").innerHTML = "";

    document.getElementById("password").type = "password";

    document.getElementById("showPassword").checked = false;

};

</script>

</body>
</html>
